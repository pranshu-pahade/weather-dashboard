<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #87CEEB;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-box input {
            padding: 10px;
            width: 280px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #4a90e2;
        }

        .search-box button {
            padding: 10px 20px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .search-box button:hover {
            background-color: #357abd;
        }

        .weather-card {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
            display: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .city-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .weather-icon {
            font-size: 70px;
            margin: 15px 0;
        }

        .temperature {
            font-size: 50px;
            font-weight: bold;
            color: #4a90e2;
            margin-bottom: 5px;
        }

        .description {
            font-size: 18px;
            color: #666;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .details {
            display: flex;
            justify-content: space-around;
            background-color: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-item p:first-child {
            font-size: 13px;
            color: #999;
            margin-bottom: 4px;
        }

        .detail-item p:last-child {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .error-msg {
            text-align: center;
            color: red;
            font-size: 16px;
            margin-top: 10px;
            display: none;
        }

        /* forecast section */
        .forecast-title {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            text-align: left;
            margin-bottom: 10px;
        }

        .forecast-box {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .forecast-day {
            background: #f0f0f0;
            border-radius: 8px;
            padding: 10px 5px;
            text-align: center;
            flex: 1;
        }

        .forecast-day p {
            font-size: 12px;
            color: #666;
        }

        .forecast-day .f-icon {
            font-size: 24px;
            margin: 5px 0;
        }

        .forecast-day .f-temp {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .quick-btns {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .quick-btns button {
            padding: 6px 14px;
            background: white;
            border: 1px solid #4a90e2;
            border-radius: 20px;
            color: #4a90e2;
            cursor: pointer;
            font-size: 13px;
        }

        .quick-btns button:hover {
            background: #4a90e2;
            color: white;
        }

        .note {
            text-align: center;
            font-size: 12px;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>🌤️ Weather App</h1>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name..." />
        <button onclick="getWeather()">Search</button>
    </div>

    <div class="quick-btns">
        <button onclick="quickSearch('Pune')">Pune</button>
        <button onclick="quickSearch('Mumbai')">Mumbai</button>
        <button onclick="quickSearch('Delhi')">Delhi</button>
        <button onclick="quickSearch('London')">London</button>
        <button onclick="quickSearch('New York')">New York</button>
    </div>

    <p class="error-msg" id="errorMsg">City not found. Please try again.</p>

    <div class="weather-card" id="weatherCard">
        <div class="city-name" id="cityName"></div>
        <div class="weather-icon" id="weatherIcon"></div>
        <div class="temperature" id="temperature"></div>
        <div class="description" id="description"></div>

        <div class="details">
            <div class="detail-item">
                <p>Humidity</p>
                <p id="humidity">-</p>
            </div>
            <div class="detail-item">
                <p>Wind</p>
                <p id="wind">-</p>
            </div>
            <div class="detail-item">
                <p>Feels Like</p>
                <p id="feelsLike">-</p>
            </div>
        </div>

        <div class="forecast-title">5-Day Forecast</div>
        <div class="forecast-box" id="forecastBox"></div>
    </div>

    <p class="note">Note: Replace 1742e9f339ce33615c3623fdc55e138b with your OpenWeatherMap API key to get live data.
    </p>

    <script>
        // get free API key from openweathermap.org
        var API_KEY = "1742e9f339ce33615c3623fdc55e138b";

        var weatherEmojis = {
            "Clear": "☀️",
            "Clouds": "⛅",
            "Rain": "🌧️",
            "Drizzle": "🌦️",
            "Thunderstorm": "⛈️",
            "Snow": "❄️",
            "Mist": "🌫️",
            "Haze": "🌫️",
            "Fog": "🌫️"
        };

        function quickSearch(city) {
            document.getElementById("cityInput").value = city;
            getWeather();
        }

        function getWeather() {
            var city = document.getElementById("cityInput").value;

            if (city == "") {
                alert("Please enter a city name!");
                return;
            }

            document.getElementById("errorMsg").style.display = "none";

            // show demo data if no API key
            if (API_KEY == "1742e9f339ce33615c3623fdc55e138b") {
                showDemo(city);
                return;
            }

            // fetch real data
            fetch("https://api.openweathermap.org/data/2.5/weather?q=" + city + "&appid=" + API_KEY + "&units=metric")
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("City not found");
                    }
                    return response.json();
                })
                .then(function (data) {
                    document.getElementById("cityName").innerText = data.name + ", " + data.sys.country;
                    document.getElementById("temperature").innerText = Math.round(data.main.temp) + "°C";
                    document.getElementById("description").innerText = data.weather[0].description;
                    document.getElementById("humidity").innerText = data.main.humidity + "%";
                    document.getElementById("wind").innerText = Math.round(data.wind.speed * 3.6) + " km/h";
                    document.getElementById("feelsLike").innerText = Math.round(data.main.feels_like) + "°C";

                    var icon = weatherEmojis[data.weather[0].main];
                    if (!icon) icon = "🌡️";
                    document.getElementById("weatherIcon").innerText = icon;

                    document.getElementById("weatherCard").style.display = "block";
                })
                .catch(function (error) {
                    document.getElementById("errorMsg").style.display = "block";
                });

            // fetch forecast
            fetch("https://api.openweathermap.org/data/2.5/forecast?q=" + city + "&appid=" + API_KEY + "&units=metric")
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    showForecast(data);
                });
        }

        function showForecast(data) {
            var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            var seen = {};
            var forecasts = [];

            for (var i = 0; i < data.list.length; i++) {
                var item = data.list[i];
                var date = item.dt_txt.split(" ")[0];
                if (!seen[date] && forecasts.length < 5) {
                    seen[date] = true;
                    forecasts.push(item);
                }
            }

            var html = "";
            for (var j = 0; j < forecasts.length; j++) {
                var f = forecasts[j];
                var d = new Date(f.dt_txt);
                var icon = weatherEmojis[f.weather[0].main] || "🌡️";
                html += '<div class="forecast-day">';
                html += '<p>' + days[d.getDay()] + '</p>';
                html += '<div class="f-icon">' + icon + '</div>';
                html += '<p class="f-temp">' + Math.round(f.main.temp) + '°C</p>';
                html += '</div>';
            }

            document.getElementById("forecastBox").innerHTML = html;
        }

        function showDemo(city) {
            document.getElementById("cityName").innerText = city + " (Demo)";
            document.getElementById("temperature").innerText = "29°C";
            document.getElementById("description").innerText = "partly cloudy";
            document.getElementById("humidity").innerText = "68%";
            document.getElementById("wind").innerText = "12 km/h";
            document.getElementById("feelsLike").innerText = "32°C";
            document.getElementById("weatherIcon").innerText = "⛅";
            document.getElementById("weatherCard").style.display = "block";

            var demoForecast = [
                { day: "Mon", icon: "☀️", temp: "31°C" },
                { day: "Tue", icon: "🌧️", temp: "24°C" },
                { day: "Wed", icon: "⛈️", temp: "21°C" },
                { day: "Thu", icon: "⛅", temp: "27°C" },
                { day: "Fri", icon: "☀️", temp: "30°C" }
            ];

            var html = "";
            for (var i = 0; i < demoForecast.length; i++) {
                var f = demoForecast[i];
                html += '<div class="forecast-day">';
                html += '<p>' + f.day + '</p>';
                html += '<div class="f-icon">' + f.icon + '</div>';
                html += '<p class="f-temp">' + f.temp + '</p>';
                html += '</div>';
            }
            document.getElementById("forecastBox").innerHTML = html;
        }

        // press enter to search
        document.getElementById("cityInput").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                getWeather();
            }
        });
    </script>

</body>

</html>
